# tach module boundaries for the flat-module `knowledge` repo (#36), laid out as a hexagon.
#
# Read the README "Architecture enforcement" section and docs/architecture.md first. Summary:
#   * Every top-level module (and every numbered script) is one tach module.
#   * `depends_on` is a deny-by-default ALLOWLIST: an import not listed here fails
#     `uv run tach check`. That is how "`paths` is imported only by an allowlist" and
#     "`private_git` is imported only by add_fact / review / knowledge" are enforced.
#   * `layer` adds the direction rule on top. The layers are the hexagon, outermost first, and a module
#     may only import from its own layer or a lower one:
#
#       serving    the HTTP review page (inbox)                       driving adapter
#       cli        the Typer app (knowledge, cli_*)                   driving adapter
#       pipeline   build.py, the numbered ETL scripts, backfill_*     driving adapter (batch)
#       facade     add_fact, review, lifecycle, facts_batch,          composition roots: pick the adapters
#                  migrate_memory                                     and bind a use case to them
#       adapter    *_store, clock, ids, paths, private_git, ...       driven adapters (db, files, git, time)
#       use_case   *_service                                          orchestrate the domain through ports
#       domain     rules, `ports` (the protocols), vocabularies       pure: no I/O, imports nothing above it
#
#     `use_case` sits BELOW `adapter` on purpose: that makes "a use case never imports an adapter" a layer
#     violation (the hexagon's central rule), while an adapter that called a use case would fall to the
#     `depends_on` allowlist. The domain is the lowest layer, so it can import nothing but itself. What a
#     layer cannot say (domain modules may not import `os`/`sqlite3`, the CLI may not import infrastructure)
#     is in the import-linter contracts in pyproject.toml, and tests/test_architecture.py checks that every
#     module's layer here agrees with its row in docs/architecture.md.
#   * root_module = "forbid": a .py file that is not listed below is an error, so a new module
#     cannot be added without choosing its layer and its allowed imports.
#
# Lines starting with `#planned:` are entries for modules that other in-flight issues are adding
# (only #2, mcp_server, is left; the wave-4 modules are active). They are inert comments today. When the module
# lands, delete the `#planned: ` prefix (tests/test_architecture.py fails with the exact line
# numbers if you forget) and adjust depends_on to the real imports. The negative tests run with
# every planned line enabled, so the planned layout is itself checked.
#
# Not expressible here: SQL in strings, importlib/__import__ loads (build.py loads the numbered
# scripts with importlib: that is the pipeline talking to itself), string-built git commands.
# The import-linter contracts (pyproject.toml) and the regex scan tests cover part of that.

source_roots = ["."]
exclude = ["tests", "docs", ".venv", "**/__pycache__"]
layers = ["serving", "cli", "pipeline", "facade", "adapter", "use_case", "domain"]
root_module = "forbid"
# Without this, tach lets a higher layer import ANY lower layer without declaring it, which would
# switch the allowlists off for the CLI, serving and pipeline (e.g. any script could import paths).
layers_explicit_depends_on = true
# Count `if TYPE_CHECKING:` imports too (tach ignores them by default): a type-only import of the
# CLI from a library is still a layering mistake.
ignore_type_checking_imports = false
# Report depends_on entries that are no longer used, so the allowlists cannot silently grow stale.
exact = true
# Cycles among libraries are checked by import-linter (pyproject.toml, "libraries-layered"),
# because there is exactly one documented, lazy exception (normal_db <-> leak_test) and tach
# has no per-edge cycle exception. Turn this on if that exception ever goes away.
forbid_circular_dependencies = false

