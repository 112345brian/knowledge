# cli_inbox is the ONE documented exception to "the CLI never imports serving": the `inbox` command
# has to START the server, so it imports `inbox` and calls inbox.serve (a launcher, nothing else).
# tach's layers cannot be overridden by depends_on, so the exception is the inline `# tach-ignore`
# on the single `import inbox` line in cli_inbox.py (not a depends_on entry, so `exact` stays on)
# plus the single matching `ignore_imports` line of the import-linter contract
# "cli-never-imports-serving". Every other CLI module (and any other import from cli_inbox) that
# imports `inbox` or `mcp_server` still fails (negative tests). A subprocess launch was rejected: it
# would need a second exception (the subprocess allowlist), lose the in-process on_ready/Ctrl-C
# handling and add nothing, since cli_inbox keeps no other serving dependency.
[[modules]]
path = "cli_inbox"
layer = "cli"
depends_on = [
    "lifecycle",        # `edit` -> lifecycle.edit_fact
]

# ===================================================================== serving (highest)
# Reads facts only through `modes`; writes only through the libraries `review` and `lifecycle`. Imports nothing else
# of this repo (no revisions, privacy, private_git, sqlite3): see import-linter "serving-reads-facts-through-modes".

[[modules]]
path = "inbox"          # #33. Pure serving: no revisions / privacy / private_git / sqlite3 (import-linter
layer = "serving"       # "serving-reads-facts-through-modes"); writes and display state come from lifecycle / review.
depends_on = [
    "lifecycle",        # edit_fact, set_visibility(raise_only=True)
    "review",           # list/approve/reject, pending_view, status_word
]

