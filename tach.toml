# tach module boundaries for the flat-module `knowledge` repo (#36), laid out as an onion.
#
# Read the README "Architecture enforcement" section and docs/architecture.md first. Summary:
#   * Every top-level module, and every module of the `ingest` package (as `ingest.<name>`), is one tach module.
#   * `depends_on` is a deny-by-default ALLOWLIST: an import not listed here fails
#     `uv run tach check`. That is how "`paths` is imported only by an allowlist" and
#     "`private_git` is imported only by composition roots and build metadata" are enforced.
#   * `layer` adds the direction rule on top. The layers are the onion's rings, outermost first, and a
#     module may only import from its own ring or an inner one:
#
#       serving         the HTTP review page (inbox)                  driving adapter
#       cli             the Typer app (knowledge, cli_*)              driving adapter
#       pipeline        build.py, the ingest package, the client sources  driving adapter (batch). The
#                       client sources' own rule modules (music, measurements) live here too: pure,
#                       but specific to one person's domain, so they are plugins, not the domain core.
#                       The build tooling (normal_db, leak_test, leak_scan_store) and the rule modules the
#                       pipeline alone uses (ingest rules, build/normal/leak rules) sit here as well.
#       composition     add_fact, review, lifecycle, facts_batch,     composition roots: pick the adapters
#                       migrate_memory, rules_edit, entities, ...     and bind an application service to them
#       infrastructure  *_store, clock, ids, paths, private_git, ...  db, files, git, time (implement ports)
#       application     *_service                                     orchestrate the domain through ports
#       domain_services rules, `*_port` protocols, policies           pure: no I/O, imports only the model
#       model           vocabularies, time/identifier primitives      pure: imports nothing else in the repo
#
#     `application` sits inside `infrastructure` on purpose: that makes "an application service never imports
#     an adapter" a layer violation (the onion's central rule), while infrastructure that called an
#     application service would fall to the `depends_on` allowlist. The model is the innermost ring, so it
#     can import nothing but itself. What a layer cannot say (domain modules may not import `os`/`sqlite3`,
#     the CLI may not import infrastructure) is in the import-linter contracts in pyproject.toml, and
#     tests/test_architecture.py checks that every module's layer here agrees with its row in
#     docs/architecture.md.
#   * root_module = "forbid": a .py file that is not listed below is an error, so a new module
#     cannot be added without choosing its layer and its allowed imports.
#
# Lines starting with `#planned:` are entries for modules that other in-flight issues are adding
# (only #2, mcp_server, is left; the wave-4 modules are active). They are inert comments today. When the module
# lands, delete the `#planned: ` prefix (tests/test_architecture.py fails with the exact line
# numbers if you forget) and adjust depends_on to the real imports. The negative tests run with
# every planned line enabled, so the planned layout is itself checked.
#
# Not expressible here: SQL in strings, importlib/__import__ loads (build.py loads the ingest steps
# with importlib: that is the pipeline talking to itself), string-built git commands.
# The import-linter contracts (pyproject.toml) and the regex scan tests cover part of that.

source_roots = ["."]
exclude = ["tests", "docs", ".venv", "**/__pycache__"]
layers = ["serving", "cli", "pipeline", "composition", "infrastructure", "application", "domain_services", "model"]
root_module = "forbid"
# Without this, tach lets a higher layer import ANY lower layer without declaring it, which would
# switch the allowlists off for the CLI, serving and pipeline (e.g. any script could import paths).
layers_explicit_depends_on = true
# Count `if TYPE_CHECKING:` imports too (tach ignores them by default): a type-only import of the
# CLI from a library is still a layering mistake.
ignore_type_checking_imports = false
# Report depends_on entries that are no longer used, so the allowlists cannot silently grow stale.
exact = true
# Import-linter and tach both enforce acyclic library and CLI graphs.
forbid_circular_dependencies = true

# ===================================================================== the onion: model, domain services, application services, infrastructure, composition
# Importable modules that return data. No typer, no CLI, no serving, no pipeline.

