[project]
name = "knowledge"
version = "0.1.0"
description = "Personal knowledge base pipeline (schema.sql + ingest scripts -> knowledge.db) with a CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "tach>=0.35.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# --------------------------------------------------------------------------------------------
# import-linter contracts (#36). See README "Architecture enforcement".
#
# The repo is flat top-level modules, which grimp/import-linter cannot analyse directly (it only
# accepts packages), so the check runs on a generated shadow package `kn` (one `kn.<module>` per
# top-level module, imports rewritten; see tests/arch_check.py). Run it with
#     uv run python tests/arch_check.py        # tach + import-linter + git scan
# or just `uv run pytest tests/test_architecture.py`. Plain `uv run lint-imports` cannot work on
# a flat repo (it fails with "'x' is a module, not a package").
#
# Layers, top to bottom:  serving (inbox, mcp_server)  >  CLI (knowledge, cli_*)  >
#   pipeline (build, numbered scripts, backfill_*, ...)  >  libraries.  tach.toml holds the
#   per-module import allowlists (and the `paths` / `private_git` allowlists); the contracts here
#   cover what tach cannot: external packages (typer, sqlite3, subprocess) and the library DAG.
#
# Lines starting `#planned:` are entries for modules still in flight on other branches. They are
# inert; delete the `#planned: ` prefix when the module lands (the test tells you which lines).
# --------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["kn"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "libraries-never-import-upward"
name = "Libraries never import the CLI, serving or pipeline layers"
# Why: the CLI and the serving layers are thin wrappers over library functions (#34). If a library
# imported them, the library would no longer be reusable by the CLI, the inbox and the MCP server alike.
type = "forbidden"
source_modules = [
    "kn.add_fact",
    "kn.claims_audit",
    "kn.clock",
    "kn.leak_test",
    "kn.modes",
    "kn.normal_db",
    "kn.paths",
    "kn.privacy",
    "kn.private_git",
    "kn.review",
    "kn.revisions",
#planned:     "kn.facts_batch",
#planned:     "kn.lifecycle",
#planned:     "kn.migrate_memory",
]
forbidden_modules = [
    # CLI
    "kn.cli_parity",
    "kn.knowledge",
#planned:     "kn.cli_facts_batch",
#planned:     "kn.cli_inbox",
#planned:     "kn.cli_lifecycle",
#planned:     "kn.cli_migrate",
    # serving
#planned:     "kn.inbox",
#planned:     "kn.mcp_server",
    # pipeline / ingest (the numbered scripts are not importable, see tach.toml)
    "kn._shared",
    "kn.backfill_dates",
    "kn.backfill_source_keys",
    "kn.build",
    "kn.clean_concerts_csv",
    "kn.export_music_taste",
    "kn.snapshot_date",
]

[[tool.importlinter.contracts]]
id = "typer-only-in-knowledge"
name = "Libraries and the parity registry never import typer (or click)"
# Why: library functions and cli_parity must stay importable without Typer (build.py and add_fact.py
# run standalone, #34). Only the Typer app modules (knowledge.py, cli_*.py) may import it; this is the
# conditional-import edge case: knowledge.py's `import typer` is the intended single entry point.
type = "forbidden"
source_modules = [
    "kn.add_fact",
    "kn.claims_audit",
    "kn.clock",
    "kn.cli_parity",
    "kn.leak_test",
    "kn.modes",
    "kn.normal_db",
    "kn.paths",
    "kn.privacy",
    "kn.private_git",
    "kn.review",
    "kn.revisions",
#planned:     "kn.facts_batch",
#planned:     "kn.inbox",
#planned:     "kn.lifecycle",
#planned:     "kn.mcp_server",
#planned:     "kn.migrate_memory",
]
forbidden_modules = ["typer", "click"]

