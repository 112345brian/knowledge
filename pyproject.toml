[project]
name = "knowledge"
version = "0.1.0"
description = "Personal knowledge base pipeline (schema.sql + ingest scripts -> knowledge.db) with a CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
