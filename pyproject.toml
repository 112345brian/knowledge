[project]
name = "knowledge"
version = "0.1.0"
description = "Personal knowledge base pipeline (schema.sql + ingest scripts -> knowledge.db) with a CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "tach>=0.35.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Run in parallel by default (about 40 s instead of about 4 min for the whole suite; many tests are
# subprocess- or temp-git-repo-heavy). Nothing is skipped or marked slow: the architecture tests
# run every time. Serial run if you need it: `uv run pytest -n 0`.
addopts = "-n auto"

# --------------------------------------------------------------------------------------------
# import-linter contracts (#36). See README "Architecture enforcement".
#
# The repo is flat top-level modules plus the `ingest` package, which grimp/import-linter cannot analyse
# directly (it only accepts packages), so the check runs on a generated shadow package `kn`: every top-level
# module AND every module of `ingest/` becomes `kn.<name>` (the names are unique across both; see
# tests/arch_check.py, which also rewrites `from ingest import x` / `import ingest.x` to `kn.x`). Run it with
#     uv run python tests/arch_check.py        # tach + import-linter + git scan
# or just `uv run pytest tests/test_architecture.py`. Plain `uv run lint-imports` cannot work on
# a flat repo (it fails with "'x' is a module, not a package").
#
# The hexagon, as tach.toml's seven layers (outermost first; a module imports its own layer or a lower one):
#   serving   the HTTP review page (inbox, mcp_server)            driving adapter
#   cli       the Typer app (knowledge, cli_*)                    driving adapter
#   pipeline  build.py and the ingest steps/tools                 driving adapter (batch)
#   facade    review, lifecycle, add_fact, facts_batch,           composition roots: pick the adapters and
#             migrate_memory, rules_edit                          bind a use case to them
#   adapter   *_store, clock, ids, paths, locks, private_git, ... driven adapters (db, files, git, time)
#   use_case  *_service                                           orchestrate the domain through ports
#   domain    rules, ports, vocabularies                          pure: no I/O
# tach.toml holds the per-module import allowlists (and the `paths` / `private_git` allowlists); the
# contracts here cover what tach cannot: external packages (typer, sqlite3, subprocess), what the domain, the
# use cases and the driving adapters may not touch, and the library DAG.
#
# Lines starting `#planned:` are entries for modules still in flight on other branches. They are
# inert; delete the `#planned: ` prefix when the module lands (the test tells you which lines).
# --------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["kn"]
include_external_packages = true

