[project]
name = "knowledge"
version = "0.1.0"
description = "Personal knowledge base pipeline (schema.sql + ingest scripts -> knowledge.db) with a CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "tach>=0.35.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Run in parallel by default (about 40 s instead of about 4 min for the whole suite; many tests are
# subprocess- or temp-git-repo-heavy). Nothing is skipped or marked slow: the architecture tests
# run every time. Serial run if you need it: `uv run pytest -n 0`.
addopts = "-n auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "tests"
files = ["wiring.py", "private_git_port.py", "facts_file_port.py", "clock_port.py", "ids_port.py", "add_fact_port.py", "privacy_rules_port.py", "entities_service.py", "subjects_service.py", "subject_hierarchy_service.py", "subject_repository_port.py", "entities.py", "subjects.py", "build_records.py", "build_repositories_port.py", "build_steps_port.py", "identity_rules.py", "identity_service.py", "build_composition.py", "music_repository_port.py", "music_ingest_service.py", "music_store.py", "build_port.py", "build_service.py", "tests/port_types.py", "tests/build_port_types.py"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
follow_imports = "silent"

# --------------------------------------------------------------------------------------------
# import-linter contracts (#36). See README "Architecture enforcement".
#
# The repo is flat top-level modules plus the `ingest` and `client` packages, which grimp/import-linter cannot analyse
# directly (it only accepts packages), so the check runs on a generated shadow package `kn`: every top-level
# module AND every module of `ingest/` and `client/` becomes `kn.<name>` (the names are unique across both; see
# tests/arch_check.py, which also rewrites `from ingest import x` / `import ingest.x` to `kn.x`). Run it with
#     uv run python tests/arch_check.py        # tach + import-linter + git scan
# or just `uv run pytest tests/test_architecture.py`. Plain `uv run lint-imports` cannot work on
# a flat repo (it fails with "'x' is a module, not a package").
#
# The onion, as tach.toml's eight layers (outermost first; a module imports its own ring or an inner one):
#   serving         the HTTP review page (inbox, mcp_server)      driving adapter
#   cli             the Typer app (knowledge, cli_*)              driving adapter
#   pipeline        build.py and the ingest steps/tools           driving adapter (batch)
#   composition     review, lifecycle, add_fact, facts_batch,     composition roots: pick the adapters and
#                   migrate_memory, rules_edit, entities, ...     bind an application service to them
#   infrastructure  *_store, clock, ids, paths, locks, git, ...   db, files, git, time (implement the ports)
#   application     *_service                                     orchestrate the domain through ports
#   domain_services rules, `*_port` protocols, policies           pure: no I/O
#   model           vocabularies, time and identifier primitives  pure: imports nothing else in the repo
# tach.toml holds the per-module import allowlists (and the `paths` / `private_git` allowlists); the
# contracts here cover what tach cannot: external packages (typer, sqlite3, subprocess), what the domain, the
# use cases and the driving adapters may not touch, and the library DAG.
#
# Lines starting `#planned:` are entries for modules still in flight on other branches. They are
# inert; delete the `#planned: ` prefix when the module lands (the test tells you which lines).
# --------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["kn"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "libraries-never-import-upward"
name = "Libraries never import the CLI, serving or pipeline layers"
# Why: the CLI and the serving layers are thin wrappers over library functions (#34). If a library
# imported them, the library would no longer be reusable by the CLI, the inbox and the MCP server alike.
