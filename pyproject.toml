[[tool.importlinter.contracts]]
id = "cli-never-imports-serving"
name = "The CLI never imports the serving layers"
# Why: serving (inbox, mcp_server) sits above the CLI; a CLI module that imported it could pull the
# server into every command.
# THE ONE EXCEPTION: `kn.cli_inbox -> kn.inbox`. The `inbox` command has to START the server, so
# cli_inbox is a launcher (it only calls inbox.serve; its `edit` command uses lifecycle). It is one
# named edge, ignored below; any other CLI module importing serving, or cli_inbox importing
# mcp_server, still fails (tests/test_architecture.py negative cases). tach.toml has the matching
# inline `# tach-ignore inbox` on that same single import line in cli_inbox.py.
type = "forbidden"
source_modules = [
    "kn.cli_facts_batch",
    "kn.cli_inbox",
    "kn.cli_lifecycle",
    "kn.cli_migrate",
    "kn.cli_parity",
    "kn.knowledge",
    "kn.cli_entities",
    "kn.cli_sources",
    "kn.cli_subjects",
]
forbidden_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
ignore_imports = [
    "kn.cli_inbox -> kn.inbox",   # launcher: the `inbox` command starts the server (see above)
]

