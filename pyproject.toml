[[tool.importlinter.contracts]]
id = "serving-reads-facts-through-modes"
name = "Serving reads facts only through modes"
# Why: modes is the one place that enforces off/normal/private (#22). A serving module that
# imported knowledge's query functions, claims_audit, a raw sqlite3 connection, the git helper or
# the revision/privacy internals could read a private fact in normal mode, or write one around the
# lifecycle rules.
# What serving MAY import (everything not listed here): the libraries `review` and `lifecycle`
# (the sanctioned write path: approve/reject/edit/make-private) and `modes`, plus the standard
# library. There is NO exception: `inbox` used to import revisions, privacy and private_git
# directly; that logic now lives in lifecycle / review (#36).
# Only DIRECT imports are checked (allow_indirect_imports): review and lifecycle legitimately
# import sqlite3 / revisions / privacy / private_git themselves. Add any future exception as an
# `ignore_imports` line with a reason, e.g.  "kn.inbox -> kn.revisions"  # why.
type = "forbidden"
source_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
forbidden_modules = [
    "kn.add_fact",
    "kn.add_fact_store",
    "kn.claims_audit",
    "kn.claims_rules",
    "kn.claims_store",
    "kn.facts_batch",
    "kn.fact_ingest",
    "kn.knowledge",
    "kn.leak_test",
    "kn.leak_scan_store",
    "kn.lifecycle_store",
    "kn.migrate_memory",
    "kn.migrate_memory_store",
    "kn.ids",
    "kn.locks",
    "kn.fact_queries",
    "kn.normal_db",
    "kn.normal_db_service",
    "kn.normal_db_store",
    "kn.privacy",
    "kn.privacy_store",
    "kn.private_git",
    "kn.review_store",
    "kn.revisions",
    "kn.revisions_store",
    "sqlite3",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "subprocess-allowlist"
name = "Only private_git (git), script_runner (python scripts) and acquisition (xattr) import subprocess"
# Why: private_git is the only module that runs git against knowledge-private (lock, clean-tree and
# detached-HEAD checks live there, #10). This forbids every other module from spawning processes.
# script_runner.py is the one exception: `knowledge.py build`, `add-fact` and `clean-concerts` shell out to
# this repo's own scripts through it. LIMIT: import-linter sees imports, not arguments, so a module running
# git that is allowed subprocess is caught by the `scan_git_usage` AST test in tests/test_architecture.py.
type = "forbidden"
source_modules = ["kn"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true   # add_fact -> private_git -> subprocess is the intended path
# acquisition.py (#46) is the third exception: it runs the read-only macOS `xattr` command (argv list, no
# shell, a timeout, every failure a silent no-op) to read a file's download URL and time, as the issue specifies.
# It never writes an attribute and never runs anything else; a test pins the exact argv shapes.
ignore_imports = [
    "kn.private_git -> subprocess",
    "kn.script_runner -> subprocess",
    "kn.acquisition_store -> subprocess",
]

