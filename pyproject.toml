[project]
name = "knowledge"
version = "0.1.0"
description = "Personal knowledge base pipeline (schema.sql + ingest scripts -> knowledge.db) with a CLI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "tach>=0.35.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run in parallel by default (about 40 s instead of about 4 min for the whole suite; many tests are
# subprocess- or temp-git-repo-heavy). Nothing is skipped or marked slow: the architecture tests
# run every time. Serial run if you need it: `uv run pytest -n 0`.
addopts = "-n auto"

# --------------------------------------------------------------------------------------------
# import-linter contracts (#36). See README "Architecture enforcement".
#
# The repo is flat top-level modules, which grimp/import-linter cannot analyse directly (it only
# accepts packages), so the check runs on a generated shadow package `kn` (one `kn.<module>` per
# top-level module, imports rewritten; see tests/arch_check.py). Run it with
#     uv run python tests/arch_check.py        # tach + import-linter + git scan
# or just `uv run pytest tests/test_architecture.py`. Plain `uv run lint-imports` cannot work on
# a flat repo (it fails with "'x' is a module, not a package").
#
# Layers, top to bottom:  serving (inbox, mcp_server)  >  CLI (knowledge, cli_*)  >
#   pipeline (build, numbered scripts, backfill_*, ...)  >  libraries.  tach.toml holds the
#   per-module import allowlists (and the `paths` / `private_git` allowlists); the contracts here
#   cover what tach cannot: external packages (typer, sqlite3, subprocess) and the library DAG.
#
# Lines starting `#planned:` are entries for modules still in flight on other branches. They are
# inert; delete the `#planned: ` prefix when the module lands (the test tells you which lines).
# --------------------------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["kn"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "libraries-never-import-upward"
name = "Libraries never import the CLI, serving or pipeline layers"
# Why: the CLI and the serving layers are thin wrappers over library functions (#34). If a library
# imported them, the library would no longer be reusable by the CLI, the inbox and the MCP server alike.
type = "forbidden"
source_modules = [
    "kn.add_fact",
    "kn.add_fact_store",
    "kn.claims_audit",
    "kn.claims_store",
    "kn.clock",
    "kn.fact_rules",
    "kn.facts_batch",
    "kn.leak_test",
    "kn.lifecycle",
    "kn.lifecycle_rules",
    "kn.lifecycle_store",
    "kn.migrate_memory",
    "kn.modes",
    "kn.modes_store",
    "kn.new_fact",
    "kn.normal_db",
    "kn.paths",
    "kn.privacy",
    "kn.privacy_store",
    "kn.private_git",
    "kn.review",
    "kn.review_rules",
    "kn.review_store",
    "kn.revisions",
    "kn.revisions_store",
    "kn.timestamps",
]
forbidden_modules = [
    # CLI
    "kn.cli_facts_batch",
    "kn.cli_inbox",
    "kn.cli_lifecycle",
    "kn.cli_migrate",
    "kn.cli_parity",
    "kn.knowledge",
    # serving
    "kn.inbox",
#planned:     "kn.mcp_server",
    # pipeline / ingest (the numbered scripts are not importable, see tach.toml)
    "kn._shared",
    "kn.backfill_dates",
    "kn.backfill_source_keys",
    "kn.build",
    "kn.clean_concerts_csv",
    "kn.export_music_taste",
    "kn.snapshot_date",
]

[[tool.importlinter.contracts]]
id = "typer-only-in-knowledge"
name = "Libraries and the parity registry never import typer (or click)"
# Why: library functions and cli_parity must stay importable without Typer (build.py and add_fact.py
# run standalone, #34). Only the Typer app modules (knowledge.py, cli_*.py) may import it; this is the
# conditional-import edge case: knowledge.py's `import typer` is the intended single entry point.
type = "forbidden"
source_modules = [
    "kn.add_fact",
    "kn.add_fact_store",
    "kn.claims_audit",
    "kn.claims_store",
    "kn.cli_parity",
    "kn.clock",
    "kn.fact_rules",
    "kn.facts_batch",
    "kn.inbox",
    "kn.leak_test",
    "kn.lifecycle",
    "kn.lifecycle_rules",
    "kn.lifecycle_store",
    "kn.migrate_memory",
    "kn.modes",
    "kn.modes_store",
    "kn.new_fact",
    "kn.normal_db",
    "kn.paths",
    "kn.privacy",
    "kn.privacy_store",
    "kn.private_git",
    "kn.review",
    "kn.review_rules",
    "kn.review_store",
    "kn.revisions",
    "kn.revisions_store",
    "kn.timestamps",
#planned:     "kn.mcp_server",
]
forbidden_modules = ["typer", "click"]

[[tool.importlinter.contracts]]
id = "cli-never-imports-serving"
name = "The CLI never imports the serving layers"
# Why: serving (inbox, mcp_server) sits above the CLI; a CLI module that imported it could pull the
# server into every command.
# THE ONE EXCEPTION: `kn.cli_inbox -> kn.inbox`. The `inbox` command has to START the server, so
# cli_inbox is a launcher (it only calls inbox.serve; its `edit` command uses lifecycle). It is one
# named edge, ignored below; any other CLI module importing serving, or cli_inbox importing
# mcp_server, still fails (tests/test_architecture.py negative cases). tach.toml has the matching
# inline `# tach-ignore inbox` on that same single import line in cli_inbox.py.
type = "forbidden"
source_modules = [
    "kn.cli_facts_batch",
    "kn.cli_inbox",
    "kn.cli_lifecycle",
    "kn.cli_migrate",
    "kn.cli_parity",
    "kn.knowledge",
]
forbidden_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
ignore_imports = [
    "kn.cli_inbox -> kn.inbox",   # launcher: the `inbox` command starts the server (see above)
]

[[tool.importlinter.contracts]]
id = "serving-never-imports-pipeline"
name = "Serving never imports the pipeline"
# Why: the serving layers must not be able to rebuild or ingest; they only use library functions.
type = "forbidden"
source_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
forbidden_modules = [
    "kn._shared",
    "kn.backfill_dates",
    "kn.backfill_source_keys",
    "kn.build",
    "kn.clean_concerts_csv",
    "kn.export_music_taste",
    "kn.snapshot_date",
]

[[tool.importlinter.contracts]]
id = "serving-reads-facts-through-modes"
name = "Serving reads facts only through modes"
# Why: modes is the one place that enforces off/normal/private (#22). A serving module that
# imported knowledge's query functions, claims_audit, a raw sqlite3 connection, the git helper or
# the revision/privacy internals could read a private fact in normal mode, or write one around the
# lifecycle rules.
# What serving MAY import (everything not listed here): the libraries `review` and `lifecycle`
# (the sanctioned write path: approve/reject/edit/make-private) and `modes`, plus the standard
# library. There is NO exception: `inbox` used to import revisions, privacy and private_git
# directly; that logic now lives in lifecycle / review (#36).
# Only DIRECT imports are checked (allow_indirect_imports): review and lifecycle legitimately
# import sqlite3 / revisions / privacy / private_git themselves. Add any future exception as an
# `ignore_imports` line with a reason, e.g.  "kn.inbox -> kn.revisions"  # why.
type = "forbidden"
source_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
forbidden_modules = [
    "kn.add_fact",
    "kn.add_fact_store",
    "kn.claims_audit",
    "kn.claims_store",
    "kn.facts_batch",
    "kn.knowledge",
    "kn.leak_test",
    "kn.lifecycle_store",
    "kn.migrate_memory",
    "kn.normal_db",
    "kn.privacy",
    "kn.privacy_store",
    "kn.private_git",
    "kn.review_store",
    "kn.revisions",
    "kn.revisions_store",
    "sqlite3",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "subprocess-allowlist"
name = "Only private_git (git) and knowledge (python scripts) import subprocess"
# Why: private_git is the only module that runs git against knowledge-private (lock, clean-tree and
# detached-HEAD checks live there, #10). This forbids every other module from spawning processes.
# knowledge.py is the one exception: `build`, `add-fact` and `clean-concerts` shell out to this
# repo's own scripts. LIMIT: import-linter sees imports, not arguments, so knowledge.py running git
# is caught by the `scan_git_usage` AST test in tests/test_architecture.py, not here.
type = "forbidden"
source_modules = ["kn"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true   # add_fact -> private_git -> subprocess is the intended path
ignore_imports = [
    "kn.private_git -> subprocess",
    "kn.knowledge -> subprocess",
]

[[tool.importlinter.contracts]]
id = "domain-has-no-infrastructure"
name = "Domain modules never touch the file system, the database, processes or an adapter"
# Why (hexagonal architecture): the domain is the hexagon's inside. It holds the rules and decisions
# and takes plain data in, returns plain data out, so it can be tested without a disk, a database or
# git, and any driving adapter (CLI, inbox, MCP) or driven adapter (sqlite, files, git) can be
# swapped without touching it. The adapters live in their own modules and import the domain, never
# the other way round (the layered contract below already forbids the upward import).
# DOMAIN today: privacy (rules + resolver), modes (mode policy), claims_audit (staleness rules),
# revisions (entries, keys, log format, the next revision), review_rules, lifecycle_rules, new_fact,
# fact_rules and timestamps. Their adapters: privacy_store, modes_store, claims_store, revisions_store,
# review_store, lifecycle_store, add_fact_store. `review`, `lifecycle` and `add_fact` are the use cases
# that wire the adapters to the rules.
# The other libraries still mix rules with sqlite3 / os / git and are migrated one at a time. A
# module joins this list only when it is clean, so the list is a ratchet: it can grow, never shrink
# (tests/test_architecture.py pins it). Direct imports only, because the ADAPTER legitimately
# imports the domain, and a domain module may import another domain module.
type = "forbidden"
source_modules = [
    "kn.claims_audit",
    "kn.fact_rules",
    "kn.modes",
    "kn.lifecycle_rules",
    "kn.new_fact",
    "kn.privacy",
    "kn.review_rules",
    "kn.revisions",
    "kn.timestamps",
]
forbidden_modules = [
    # infrastructure the domain must not touch
    "sqlite3", "os", "pathlib", "io", "shutil", "tempfile", "glob", "fcntl", "msvcrt",
    "subprocess", "socket", "http", "urllib", "uuid",
    # adapters and the modules that wrap infrastructure
    "kn.privacy_store", "kn.modes_store", "kn.claims_store", "kn.revisions_store", "kn.review_store",
    "kn.add_fact_store", "kn.lifecycle_store", "kn.add_fact", "kn.lifecycle", "kn.review", "kn.private_git",
    "kn.paths", "kn.clock",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "libraries-layered"
name = "Libraries form a DAG (no cycles) in a fixed order"
# Why: a layers contract forbids any import that points up the list, so it also forbids cycles.
# Higher entries may import lower ones; entries joined with `|` are independent of each other.
# Adding a library means choosing its row. Exactly one cycle exists today and is accepted:
# normal_db lazily imports leak_test (to leak-check what it built) and leak_test.self_test lazily
# imports normal_db (to build a fixture). Both imports are inside functions; the upward one is ignored below.
type = "layers"
containers = ["kn"]
layers = [
    "facts_batch | lifecycle | migrate_memory",
    "modes_store | claims_store",
    "review | modes | claims_audit | normal_db",
    "leak_test",
    "review_store | lifecycle_store",
    "revisions_store",
    "add_fact",
    "privacy_store",
    "add_fact_store | revisions | review_rules | lifecycle_rules",
    "new_fact",
    "privacy | private_git",
    "clock | paths | timestamps | fact_rules",
]
ignore_imports = [
    "kn.leak_test -> kn.normal_db",   # documented lazy cycle, see above
]
