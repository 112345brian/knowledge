[[tool.importlinter.contracts]]
id = "subprocess-allowlist"
name = "Only private_git (git) and knowledge (python scripts) import subprocess"
# Why: private_git is the only module that runs git against knowledge-private (lock, clean-tree and
# detached-HEAD checks live there, #10). This forbids every other module from spawning processes.
# knowledge.py is the one exception: `build`, `add-fact` and `clean-concerts` shell out to this
# repo's own scripts. LIMIT: import-linter sees imports, not arguments, so knowledge.py running git
# is caught by the `scan_git_usage` AST test in tests/test_architecture.py, not here.
type = "forbidden"
source_modules = ["kn"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true   # add_fact -> private_git -> subprocess is the intended path
ignore_imports = [
    "kn.private_git -> subprocess",
    "kn.knowledge -> subprocess",
]

[[tool.importlinter.contracts]]
id = "libraries-layered"
name = "Libraries form a DAG (no cycles) in a fixed order"
# Why: a layers contract forbids any import that points up the list, so it also forbids cycles.
# Higher entries may import lower ones; entries joined with `|` are independent of each other.
# Adding a library means choosing its row. Exactly one cycle exists today and is accepted:
# normal_db lazily imports leak_test (to leak-check what it built) and leak_test.self_test lazily
# imports normal_db (to build a fixture). Both imports are inside functions; the upward one is ignored below.
type = "layers"
containers = ["kn"]
layers = [
#planned:     "facts_batch | lifecycle | migrate_memory",
    "review | modes | claims_audit | normal_db",
    "leak_test",
    "revisions",
    "add_fact",
    "privacy | private_git",
    "clock | paths",
]
ignore_imports = [
    "kn.leak_test -> kn.normal_db",   # documented lazy cycle, see above
]
