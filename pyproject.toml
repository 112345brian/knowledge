[[tool.importlinter.contracts]]
id = "serving-reads-facts-through-modes"
name = "Serving reads facts only through modes"
# Why: modes is the one place that enforces off/normal/private (#22). A serving module that
# imported knowledge's query functions, claims_audit, a raw sqlite3 connection, the git helper or
# the revision/privacy internals could read a private fact in normal mode, or write one around the
# lifecycle rules.
# What serving MAY import (everything not listed here): the libraries `review` and `lifecycle`
# (the sanctioned write path: approve/reject/edit/make-private) and `modes`, plus the standard
# library. There is NO exception: `inbox` used to import revisions, privacy and private_git
# directly; that logic now lives in lifecycle / review (#36).
# Only DIRECT imports are checked (allow_indirect_imports): review and lifecycle legitimately
# import sqlite3 / revisions / privacy / private_git themselves. Add any future exception as an
# `ignore_imports` line with a reason, e.g.  "kn.inbox -> kn.revisions"  # why.
type = "forbidden"
source_modules = [
    "kn.inbox",
#planned:     "kn.mcp_server",
]
forbidden_modules = [
    "kn.add_fact",
    "kn.add_fact_store",
    "kn.claims_audit",
    "kn.claims_store",
    "kn.facts_batch",
    "kn.knowledge",
    "kn.leak_test",
    "kn.lifecycle_store",
    "kn.migrate_memory",
    "kn.migrate_memory_store",
    "kn.ids",
    "kn.locks",
    "kn.fact_queries",
    "kn.normal_db",
    "kn.privacy",
    "kn.privacy_store",
    "kn.private_git",
    "kn.review_store",
    "kn.revisions",
    "kn.revisions_store",
    "sqlite3",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "subprocess-allowlist"
name = "Only private_git (git), script_runner (python scripts) and acquisition (xattr) import subprocess"
# Why: private_git is the only module that runs git against knowledge-private (lock, clean-tree and
# detached-HEAD checks live there, #10). This forbids every other module from spawning processes.
# script_runner.py is the one exception: `knowledge.py build`, `add-fact` and `clean-concerts` shell out to
# this repo's own scripts through it. LIMIT: import-linter sees imports, not arguments, so a module running
# git that is allowed subprocess is caught by the `scan_git_usage` AST test in tests/test_architecture.py.
type = "forbidden"
source_modules = ["kn"]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true   # add_fact -> private_git -> subprocess is the intended path
# acquisition.py (#46) is the third exception: it runs the read-only macOS `xattr` command (argv list, no
# shell, a timeout, every failure a silent no-op) to read a file's download URL and time, as the issue specifies.
# It never writes an attribute and never runs anything else; a test pins the exact argv shapes.
ignore_imports = [
    "kn.private_git -> subprocess",
    "kn.script_runner -> subprocess",
    "kn.acquisition_store -> subprocess",
]

[[tool.importlinter.contracts]]
id = "domain-has-no-infrastructure"
name = "Domain modules never touch the file system, the database, processes or an adapter"
# Why (hexagonal architecture): the domain is the hexagon's inside. It holds the rules and decisions
# and takes plain data in, returns plain data out, so it can be tested without a disk, a database or
# git, and any driving adapter (CLI, inbox, MCP) or driven adapter (sqlite, files, git) can be
# swapped without touching it. The adapters live in their own modules and import the domain, never
# the other way round (the layered contract below already forbids the upward import).
# DOMAIN today: privacy (rules + resolver), modes (mode policy), claims_audit (staleness rules),
# revisions (entries, keys, log format, the next revision), review_rules, lifecycle_rules, new_fact,
# facts_batch_rules, migrate_memory_rules, normal_rules, leak_rules, fact_rules, timestamps, ports and the
# pipeline's rules (artist_rules, fact_ingest_rules, source_ingest_rules, music_ingest_rules, seed_rules,
# measurement_rules, build_rules, backfill_rules; the ingest steps and build.py are the ETL adapters). Their
# adapters: privacy_store, modes_store, claims_store, revisions_store, review_store, lifecycle_store,
# add_fact_store, migrate_memory_store (normal_db and leak_test are the adapters for their rules).
# `review`, `lifecycle`, `add_fact`, `facts_batch`, `migrate_memory` and `rules_edit` are the facades
# (composition roots) that bind a use case (a *_service) to its adapters.
# The other libraries still mix rules with sqlite3 / os / git and are migrated one at a time. A
# module joins this list only when it is clean, so the list is a ratchet: it can grow, never shrink
# (tests/test_architecture.py pins it). Direct imports only, because the ADAPTER legitimately
# imports the domain, and a domain module may import another domain module.
type = "forbidden"
source_modules = [
    "kn.artist_rules",
    "kn.backfill_rules",
    "kn.build_rules",
    "kn.claims_audit",
    "kn.fact_ingest_rules",
    "kn.fact_rules",
    "kn.facts_batch_rules",
    "kn.leak_rules",
    "kn.lifecycle_rules",
    "kn.measurement_rules",
    "kn.migrate_memory_rules",
    "kn.modes",
    "kn.music_ingest_rules",
    "kn.new_fact",
    "kn.normal_rules",
    "kn.ports",
    "kn.privacy",
    "kn.review_rules",
    "kn.revisions",
    "kn.seed_rules",
    "kn.source_ingest_rules",
    "kn.timestamps",
    "kn.identifiers",
    "kn.source_status",
    "kn.textmatch",
    "kn.validtime",
]
forbidden_modules = [
    # infrastructure the domain must not touch
    "sqlite3", "os", "pathlib", "io", "shutil", "tempfile", "glob", "fcntl", "msvcrt",
    "subprocess", "socket", "http", "urllib", "uuid",
    # adapters and the modules that wrap infrastructure
    "kn.privacy_store", "kn.modes_store", "kn.claims_store", "kn.revisions_store", "kn.review_store",
    "kn.add_fact_store", "kn.lifecycle_store", "kn.migrate_memory_store", "kn.add_fact", "kn.lifecycle",
    "kn.review", "kn.facts_batch", "kn.migrate_memory", "kn.normal_db", "kn.leak_test", "kn.private_git",
    "kn.paths", "kn.clock",
    "kn.acquisition_store",
    "kn.build_info_store",
    "kn.entities_store",
    "kn.entity_migration_store",
    "kn.fixity_store",
    "kn.private_edit_store",
    "kn.source_status_store",
    "kn.subjects_store",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "use-cases-depend-on-ports"
name = "Use cases import ports and domain, never an adapter, a facade or infrastructure"
# Why (hexagonal architecture): a use case (the *_service modules) orchestrates the domain through the
# protocols in `ports`; it never imports an adapter, so a test can hand it fakes and an adapter can be
# swapped without touching it. The facades (review, lifecycle, add_fact, facts_batch, migrate_memory) are
# the composition roots that pick the real adapters. `os` is allowed for os.path string handling only;
# tests/test_architecture.py checks that no service touches anything else on `os`.
type = "forbidden"
source_modules = [
    "kn.add_fact_service",
    "kn.facts_batch_service",
    "kn.lifecycle_service",
    "kn.migrate_memory_service",
    "kn.review_service",
    "kn.rules_edit_service",
]
forbidden_modules = [
    "sqlite3", "pathlib", "io", "shutil", "tempfile", "glob", "fcntl", "msvcrt", "subprocess", "socket",
    "http", "urllib", "uuid",
    "kn.privacy_store", "kn.modes_store", "kn.claims_store", "kn.revisions_store", "kn.review_store",
    "kn.add_fact_store", "kn.lifecycle_store", "kn.migrate_memory_store", "kn.ids", "kn.locks", "kn.private_git",
    "kn.paths", "kn.clock", "kn.normal_db", "kn.leak_test",
    "kn.add_fact", "kn.lifecycle", "kn.review", "kn.facts_batch", "kn.migrate_memory",
    "kn.acquisition_store",
    "kn.build_info_store",
    "kn.entities_store",
    "kn.entity_migration_store",
    "kn.fixity_store",
    "kn.private_edit_store",
    "kn.source_status_store",
    "kn.subjects_store",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "driving-adapters-no-infrastructure"
name = "The CLI and the inbox reach infrastructure only through use cases and read adapters"
# Why (hexagonal architecture): the Typer app (knowledge, cli_*) and the inbox page are driving adapters:
# they turn a command or a request into a use-case call and print or render the result. They never open a
# database, spawn a process or touch files themselves, and never import a write-side adapter; writes go
# through the facades (review, lifecycle, add_fact, facts_batch, migrate_memory, rules_edit), and reads
# through the read adapters (fact_queries, which also serves the revision history, claims_store, modes_store).
# The forbidden list names every store that writes (or is both): privacy_store, private_git, revisions_store,
# add_fact_store, lifecycle_store, review_store, migrate_memory_store, locks, ... Only the three named
# exceptions below remain.
type = "forbidden"
source_modules = [
    "kn.cli_facts_batch",
    "kn.cli_inbox",
    "kn.cli_lifecycle",
    "kn.cli_migrate",
    "kn.inbox",
    "kn.knowledge",
    "kn.cli_entities",
    "kn.cli_sources",
    "kn.cli_subjects",
]
forbidden_modules = [
    "sqlite3", "subprocess", "pathlib", "shutil", "tempfile", "glob", "fcntl", "msvcrt", "uuid", "os",
    "kn.add_fact_store", "kn.lifecycle_store", "kn.review_store", "kn.migrate_memory_store", "kn.ids", "kn.locks",
    "kn.clock", "kn.paths", "kn.normal_db", "kn.leak_test", "kn.privacy_store", "kn.private_git", "kn.entities_store", "kn.entity_migration_store", "kn.subjects_store", "kn.revisions_store",
    "kn.acquisition_store",
    "kn.build_info_store",
    "kn.fixity_store",
    "kn.private_edit_store",
    "kn.source_status_store",
]
allow_indirect_imports = true
# KNOWN GAP, ratcheted: the #42/#43 commands edit entities.json / subjects.json through the entities, entity_tools
# and subjects modules directly, because those modules still mix their rules with file access and the commit flow.
# These three edges are the whole debt; they need an entities/subjects use case plus a store (as review and
# lifecycle have) before they can go. No other CLI or inbox module may add one.
ignore_imports = [
    "kn.cli_entities -> kn.entities_store",
    "kn.cli_entities -> kn.entity_migration_store",
    "kn.cli_subjects -> kn.subjects_store",
]

[[tool.importlinter.contracts]]
id = "libraries-layered"
name = "Libraries form a DAG (no cycles) in a fixed order"
# Why: a layers contract forbids any import that points up the list, so it also forbids cycles.
# Higher entries may import lower ones; entries joined with `|` are independent of each other.
# Adding a library means choosing its row. Exactly one cycle exists today and is accepted:
# normal_db lazily imports leak_test (to leak-check what it built) and leak_test.self_test lazily
# imports normal_db (to build a fixture). Both imports are inside functions; the upward one is ignored below.
type = "layers"
containers = ["kn"]
layers = [
    "facts_batch | lifecycle | migrate_memory | rules_edit | entity_migration_store",
    "modes_store | claims_store | facts_batch_service",
    "review | modes | claims_audit | normal_db",
    "leak_test | lifecycle_service | migrate_memory_service | rules_edit_service",
    "review_store | lifecycle_store | migrate_memory_store | review_service | fact_queries",
    "revisions_store | build_info_store | source_status_store",
    "add_fact",
    "privacy_store | add_fact_service | fact_ingest_rules | backfill_rules",
    "add_fact_store | revisions | review_rules | lifecycle_rules | facts_batch_rules | migrate_memory_rules | normal_rules | source_ingest_rules",
    "new_fact",
    "subjects_store",
    "entities_store",
    "privacy | source_status | acquisition_store",
    "private_edit_store",
    "private_git | clock | paths | timestamps | fact_rules | leak_rules | ports | ids | script_runner | locks | artist_rules | music_ingest_rules | seed_rules | measurement_rules | build_rules | fixity_store | validtime | textmatch | identifiers",
]
ignore_imports = [
    "kn.leak_test -> kn.normal_db",   # documented lazy cycle, see above
]
